){pick=n;setCol(n);const v=$('#pv');v.innerHTML=dragon('','',n);v.classList.remove('pop');void v.offsetWidth;v.classList.add('pop');$('#pi').innerHTML=`<b class='nm'>${n} dragon</b><div class='sm'>${COL[n][4]}</div><div class='sm'>${COL[n][2]}</div>`;document.querySelectorAll('.swc').forEach(x=>{x.classList.toggle('on',x.dataset.n==n);if(x.dataset.n==n){const w=x.parentNode;w.scrollTo({left:x.offsetLeft-w.clientWidth/2+x.offsetWidth/2,behavior:'smooth'})}})}function create(){const v=i=>$("#f_"+i).value.trim();if(!v("dn")||!v("un")){toast("Please add both names");return}S={d:{col:pick,n:v("dn"),user:v("un"),age:v("age"),ht:v("ht"),wt:v("wt"),rel:v("rel"),hatch:Date.now()+3*864e5,sc:2,items:[],eq:{}},w:{},m:{},q:[],td:[],plan:[],lg:{}};save();app()}

function app(){setCol(S.d.col);$("#app").innerHTML=stageHTML()+`<div id="main"></div><nav>${TABS.map(t=>`<button id="t_${t[0]}" onclick="go('${t[0]}')">${t[1]}<small>${t[2]}</small></button>`).join("")}</nav>`;go("home",1);if(isEgg())bub("Warm me up! "+Math.max(1,Math.ceil((S.d.hatch-Date.now())/864e5))+" days left 🥚");else bub("Ready, "+S.d.user+".")}
